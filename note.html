<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Note</title>
    <link rel="stylesheet" href="/src/styles/base.css" />
    <link rel="stylesheet" href="/src/styles/note.css" />
    <script type="module" src="/src/note/main.ts" defer></script>
  </head>
  <body>
    <header id="bar" data-tauri-drag-region>
      <button id="new" title="New note (Ctrl+N)" aria-label="New note">
        <svg viewBox="0 0 16 16"><path d="M8 3v10M3 8h10" /></svg>
      </button>
      <span class="spacer" data-tauri-drag-region></span>
      <span id="dirty" title="Saving…" hidden></span>
      <button id="color" title="Color" aria-label="Color" aria-expanded="false">
        <svg viewBox="0 0 16 16"><rect x="3.5" y="3.5" width="9" height="9" /></svg>
      </button>
      <button id="pin" title="Keep on top (Ctrl+Alt+T)" aria-label="Keep on top" aria-pressed="false">
        <svg viewBox="0 0 16 16"><path d="M6 2.5h4M7 2.5v4L4.5 9h7L9 6.5v-4M8 9v4.5" /></svg>
      </button>
      <button id="trash" title="Delete note (Ctrl+Alt+D)" aria-label="Delete note">
        <svg viewBox="0 0 16 16"><path d="M3 4.5h10M6.5 4.5V3h3v1.5M4.5 4.5l.6 8.5h5.8l.6-8.5" /></svg>
      </button>
      <button id="close" title="Close (note is kept)" aria-label="Close note">
        <svg viewBox="0 0 16 16"><path d="M4 4l8 8M12 4l-8 8" /></svg>
      </button>
    </header>
    <div id="palette" role="menu" hidden></div>
    <main id="editor"></main>
  </body>
</html>
